name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # dsh declares `engines.node: ">=24.9.0"` (apps/cli and repo root) and
        # its CI runs one 24.x line, so this plugin supports Node 24 only.
        # The patch floor matters: jsdom 30 requires ^24.15.0.
        node: ['24.15.0']
    steps:
      - uses: actions/checkout@v7

      # No explicit version: pnpm/action-setup reads `packageManager` from
      # package.json (pnpm@9.15.0). Passing `version` here while package.json
      # also pins `packageManager` trips the action's version-mismatch guard
      # (ERR_PNPM_BAD_PM_VERSION), so let the field drive it.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # --ignore-scripts: the root `prepare` script runs `pnpm build` on
      # install; we build explicitly below so CI can separate install from
      # the build/typecheck/test gates.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # `tsdown clean: false` + tsc into lib/types means a deleted source can
      # leave a stale artifact in the package; the build script wipes `lib`
      # first, and this assertion keeps it that way.
      - name: Build
        run: pnpm build

      # The bundle evaluates only in a browser: a wrong registration id,
      # an unseeded `require`, or a missing plugin face fails at page load and
      # in none of typecheck/test/build. This is the release gate for that.
      - name: Verify client bundle contract
        run: pnpm verify:client

      - name: Assert the package ships no stale build output
        run: |
          pnpm pack --pack-destination .pack-check >/dev/null
          tar tzf .pack-check/*.tgz | grep -E 'lib/(invariant|types/tsconfig\.tsbuildinfo)' && {
            echo "::error::stale build output is in the tarball (run \`pnpm build\` after deleting sources)"
            exit 1
          }
          rm -rf .pack-check

  # Browser e2e against a REAL `dsh web` (isolated $DSH_HOME): installs the
  # bundle via `dsh plugin add`, drives the WebUI with Playwright, and checks
  # that a ghost next-prompt suggestion appears after a real model round — plus
  # that the native placeholder is hidden (no double ghost text) and that Tab
  # adopts the suggestion.
  #
  # continue-on-error: this lane needs the DEEPSEEK_API_KEY secret and a live
  # model round-trip, so it can fail for reasons outside a PR's control (quota,
  # upstream latency, harness UI churn). It is a signal, not a gate; the `build`
  # job is the gate. Flip this to false once the lane has been green on `main`
  # for a while.
  e2e:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    # Reads the DEEPSEEK_API_KEY secret stored under this GitHub Environment.
    # (The secret lives in the `DEEPSEEK_API_KEY` environment, not at repo
    # scope, so the job must opt into that environment to see it.)
    environment: DEEPSEEK_API_KEY
    steps:
      - uses: actions/checkout@v7

      # No explicit version (reads packageManager pnpm@9.15.0) — same reason
      # as the build job; we upgrade pnpm to ≥10 below for dsh's use.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Same floor as `engines.node`; dsh itself requires >=24.9.0 and
          # jsdom 30 requires ^24.15.0.
          node-version: '24.15.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the plugin
        run: pnpm build

      # `dsh` manages a profile's plugins with the `pnpm` on PATH. The
      # repo's own `packageManager` is pnpm 9, which rejects `pnpm add` to a
      # workspace root, so expose pnpm ≥10 for the spawned `dsh web` install step
      # (the test's resolvePnpmBinDir detects it on PATH and skips its corepack
      # fallback).
      #
      # Use corepack (ships with Node) to activate pnpm@10 as the `pnpm` on
      # PATH. `npm install -g pnpm@10` alone is unreliable here: setup-node
      # prepends PNPM_HOME (setup-pnpm's pnpm@9 bin) and can shadow npm's
      # global bin.
      - name: Upgrade pnpm for dsh
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          pnpm --version

      # Pinned to the release the plugin's peer floor names, not `@next`: a
      # floating tag turns the lane green or red for whichever harness happened
      # to publish that day. Bump this together with `engines.node` and the
      # `@deepseek-ai/dsh-*` peer range in package.json.
      - name: Install dsh
        run: npm i -g @deepseek-ai/dsh@0.2.2-rc.5

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Fail loudly when the key is missing instead of silently skipping: the
      # e2e suite is `skipIf(!DEEPSEEK_API_KEY)`, and a silent skip would report
      # "passed" while testing nothing. Guard here so a misconfigured secret
      # cannot masquerade as a green run. Dependabot pull requests never see
      # repository/environment secrets, so for those the guard only warns and
      # the lane is skipped — failing there would paint every dependency PR red
      # for a reason outside its control.
      - name: Require DEEPSEEK_API_KEY
        if: env.DEEPSEEK_API_KEY == '' && github.actor != 'dependabot[bot]'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          echo "::error::DEEPSEEK_API_KEY secret is not set in the 'DEEPSEEK_API_KEY' GitHub Environment"
          exit 1

      - name: Note skipped e2e (dependabot has no secret access)
        if: env.DEEPSEEK_API_KEY == '' && github.actor == 'dependabot[bot]'
        run: |
          echo "::warning::DEEPSEEK_API_KEY is unavailable to dependabot pull requests; the browser e2e lane is skipped for them."

      - name: Run browser e2e
        if: env.DEEPSEEK_API_KEY != ''
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: pnpm test:e2e

      # Upload failure evidence (screenshot + page-state JSON from saveFailureShot)
      # so a ghost-timeout failure can be diagnosed from the DOM, not guessed at.
      - name: Upload e2e failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure
          path: .artifacts/**
          if-no-files-found: ignore
