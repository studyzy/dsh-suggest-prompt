name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      # No explicit version: pnpm/action-setup reads `packageManager` from
      # package.json (pnpm@9.15.0). Passing `version` here while package.json
      # also pins `packageManager` trips the action's version-mismatch guard
      # (ERR_PNPM_BAD_PM_VERSION), so let the field drive it.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # --ignore-scripts: the root `prepare` script runs `pnpm build` on
      # install; we build explicitly below so CI can separate install from
      # the build/typecheck/test gates.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Browser e2e against a REAL `dsh web` (isolated $DSH_HOME): installs the
  # bundle via `dsh plugin add`, drives the WebUI with Playwright, and checks
  # that a ghost next-prompt suggestion appears after a real model round — plus
  # that the native placeholder is hidden (no double ghost text) and that Tab
  # adopts the suggestion.
  #
  # continue-on-error: this lane needs the DEEPSEEK_API_KEY secret and a live
  # model round-trip, so it can fail for reasons outside a PR's control (quota,
  # upstream latency, harness UI churn). It is a signal, not a gate; the `build`
  # job is the gate. Flip this to false once the lane has been green on `main`
  # for a while.
  e2e:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    # Reads the DEEPSEEK_API_KEY secret stored under this GitHub Environment.
    # (The secret lives in the `DEEPSEEK_API_KEY` environment, not at repo
    # scope, so the job must opt into that environment to see it.)
    environment: DEEPSEEK_API_KEY
    steps:
      - uses: actions/checkout@v7

      # No explicit version (reads packageManager pnpm@9.15.0) — same reason
      # as the build job; we upgrade pnpm to ≥10 below for dsh's use.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the plugin
        run: pnpm build

      # `dsh` manages a profile's plugins with the `pnpm` on PATH. The
      # repo's own `packageManager` is pnpm 9, which rejects `pnpm add` to a
      # workspace root, so expose pnpm ≥10 for the spawned `dsh web` install step
      # (the test's resolvePnpmBinDir detects it on PATH and skips its corepack
      # fallback).
      #
      # Use corepack (ships with Node) to activate pnpm@10 as the `pnpm` on
      # PATH. `npm install -g pnpm@10` alone is unreliable here: setup-node
      # prepends PNPM_HOME (setup-pnpm's pnpm@9 bin) and can shadow npm's
      # global bin.
      - name: Upgrade pnpm for dsh
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          pnpm --version

      # `@next` currently resolves to 0.2.0-rc.2, the harness release this
      # plugin is adapted to (see AGENTS.md, "Version-critical contracts").
      # Keep this in step with the pinned @deepseek-ai/* ranges: the composer and
      # settings-surface selectors in tests/e2e move with the harness release.
      - name: Install latest dsh
        run: npm i -g @deepseek-ai/dsh@next

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Fail loudly when the key is missing instead of silently skipping: the
      # e2e suite is `skipIf(!DEEPSEEK_API_KEY)`, and a silent skip would report
      # "passed" while testing nothing. Guard here so a misconfigured secret
      # cannot masquerade as a green run.
      - name: Require DEEPSEEK_API_KEY
        if: env.DEEPSEEK_API_KEY == ''
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          echo "::error::DEEPSEEK_API_KEY secret is not set in the 'DEEPSEEK_API_KEY' GitHub Environment"
          exit 1

      - name: Run browser e2e
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: pnpm test:e2e

      # Upload failure evidence (screenshot + page-state JSON from saveFailureShot)
      # so a ghost-timeout failure can be diagnosed from the DOM, not guessed at.
      - name: Upload e2e failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-failure
          path: .artifacts/**
          if-no-files-found: ignore
